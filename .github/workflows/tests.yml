name: MATLAB tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Public repository: MathWorks provides the MATLAB licence for
      # GitHub-hosted runners, so no licence token is needed.
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: latest

      # Tests that need X-13, DataEcon, IRIS or Dynare skip themselves when
      # those are not installed, so they show as incomplete rather than failed.
      - uses: matlab-actions/run-tests@v2
        with:
          source-folder: .
          select-by-folder: tests
          test-results-junit: test-results/results.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
